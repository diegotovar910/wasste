<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/wasste-mark.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Wasste - an AI-powered smart waste sorting and city waste intelligence platform." />
    <title>Wasste - Smart Waste Sorting System</title>
    <script>
      // Apply the saved theme before first paint so there is no flash.
      (function () {
        try {
          var stored = localStorage.getItem('wasste-theme');
          if (stored === 'dark' || stored === 'light') {
            document.documentElement.setAttribute('data-theme', stored);
          }
        } catch (error) {
          /* private mode - fall back to the OS preference */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
